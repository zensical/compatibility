name: Compatibility

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Optional Git ref; leave empty for latest stable PyPI release
        default: ''
        required: false
        type: string
      combinations:
        description: Include the plugin combination cases
        default: false
        type: boolean
      serve:
        description: Include retained HTTP server lifecycle checks
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plugins:
    name: Plugins (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      VENV_PYTHON: ${{ matrix.os == 'windows-latest' && 'Scripts/python.exe' || 'bin/python' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        if: ${{ inputs.ref != '' }}
        with:
          repository: zensical/zensical
          ref: ${{ inputs.ref || 'master' }}
          path: .candidate/zensical
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ inputs.ref != '' }}
      - name: Install Cairo for upstream SVG rendering
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2
      - name: Install Cairo on macOS
        if: runner.os == 'macOS'
        run: |
          brew install cairo
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix cairo)/lib" >> "$GITHUB_ENV"
      - name: Install Cairo on Windows
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-cairo
      - name: Configure Cairo DLL lookup
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $cairoPath = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          "CAIROCFFI_DLL_DIRECTORIES=$cairoPath" >> $env:GITHUB_ENV
          $cairoPath >> $env:GITHUB_PATH
      - name: Install runner and MkDocs oracle
        run: |
          uv venv --python 3.12 .venv
          uv pip sync --python ".venv/$VENV_PYTHON" --require-hashes requirements/runner.txt
          uv venv --python 3.12 .environments/mkdocs
          uv pip sync --python ".environments/mkdocs/$VENV_PYTHON" --require-hashes requirements/mkdocs.txt
          ".venv/$VENV_PYTHON" scripts/prepare_oracle.py
          ".venv/$VENV_PYTHON" scripts/prepare_fonts.py
      - name: Check Cairo runtime
        run: |
          ".environments/mkdocs/$VENV_PYTHON" -c "import cairocffi; print('Cairo', cairocffi.cairo_version_string())"
      - name: Build Zensical candidate
        if: ${{ inputs.ref != '' }}
        run: |
          uv venv --python 3.12 .environments/zensical
          cd .candidate/zensical
          "../../.environments/zensical/$VENV_PYTHON" scripts/prepare.py
          uv pip install --python "../../.environments/zensical/$VENV_PYTHON" .
      - name: Record candidate revision
        if: ${{ inputs.ref != '' }}
        run: git -C .candidate/zensical rev-parse HEAD
      - name: Install API handler runtime dependencies
        if: ${{ inputs.ref != '' }}
        run: uv pip install --python ".environments/zensical/$VENV_PYTHON" --require-hashes -r requirements/candidate.txt
      - name: Install latest stable Zensical release
        if: ${{ inputs.ref == '' }}
        run: '".venv/$VENV_PYTHON" scripts/prepare_candidate.py'
      - name: Compare plugin projects
        env:
          TEST_COMBINATIONS: ${{ inputs.combinations || false }}
          TEST_SERVE: ${{ inputs.serve || false }}
        run: |
          compatibility_args=()
          if [[ "$TEST_COMBINATIONS" == "true" ]]; then
            compatibility_args+=(--combinations)
          fi
          if [[ "$TEST_SERVE" == "true" ]]; then
            compatibility_args+=(--serve)
          fi
          ".venv/$VENV_PYTHON" -m pytest \
            --zensical-python=".environments/zensical/$VENV_PYTHON" \
            "${compatibility_args[@]}"
