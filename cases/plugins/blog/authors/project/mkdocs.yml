site_name: Blog author and excerpt parity
site_url: https://example.test/
theme:
  name: material
  features:
    - navigation.indexes
plugins:
  - material/blog:
      blog_toc: true
      archive: false
      pagination: false
      authors_profiles: true
      authors_profiles_name: Team
      authors_profiles_url_format: team/{slug}
      authors_profiles_pagination: true
      authors_profiles_pagination_per_page: 1
      authors_profiles_toc: true
      post_excerpt: required
      post_excerpt_separator: "<!-- cut -->"
      post_excerpt_max_authors: 2
      post_excerpt_max_categories: 1
      post_readtime: true
      post_readtime_words_per_minute: 50
nav:
  - Home: index.md
  - Blog:
      - blog/index.md
