site_name: Custom blog directory parity
site_url: https://example.test/docs/
use_directory_urls: false
theme:
  name: material
  features:
    - navigation.indexes
plugins:
  - material/blog:
      blog_dir: journal
      post_dir: "{blog}/entries"
      archive: false
      categories: false
      authors: false
      pagination: false
nav:
  - Home: index.md
  - Journal:
      - journal/index.md
