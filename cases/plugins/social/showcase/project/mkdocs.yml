site_name: Native social cards
site_description: A broad native Material social compatibility fixture.
site_url: https://example.com/docs/
nav:
- Home: index.md
- Guides:
  - Overview: guides/index.md
  - Advanced: guides/advanced.md
- Image card: gallery/index.md
- Page opt-out: opt-out.md
- Excluded draft: drafts/internal.md
theme:
  name: material
  logo: assets/images/logo.svg
  palette:
    primary: deep purple
    accent: amber
  font:
    text: Roboto
plugins:
- search
- material/social:
    cache: true
    cache_dir: social-cache
    concurrency: 4
    cards: true
    cards_dir: assets/images/social
    cards_layout: default
    cards_exclude:
    - drafts/**
    cards_layout_options:
      background_color: '#4c1d95'
      color: '#ffffff'
      font_family: Roboto
