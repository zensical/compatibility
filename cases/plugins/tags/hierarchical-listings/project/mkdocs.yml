site_name: Material tags compatibility
site_description: A broad native tags compatibility fixture.
site_url: https://example.com/

nav:
  - Catalog: index.md
  - Guides:
      - Guide catalog: guides/index.md
      - Python language guide: guides/python.md
      - Rust language guide: guides/rust.md
  - Reference:
      - Reference audit: reference/index.md
      - API reference: reference/api.md
      - CLI reference: reference/cli.md
  - Internal operations: internal/ops.md
  - Legacy archive: archive/legacy.md

theme:
  name: material
  custom_dir: overrides

plugins:
  - search
  - material/tags:
      tags_hierarchy: true
      tags_hierarchy_separator: /
      tags_slugify_separator: "-"
      tags_slugify_format: "tag:{slug}"
      tags_sort_reverse: false
      tags_allowed:
        - Archive
        - Docs/Home
        - Docs/Guide
        - Internal
        - Legacy!
        - Operations
        - Platform/Python
        - Platform/Rust
        - Public
        - Reference/API
        - Reference/CLI
        - Status/Draft
        - Status/Stable
        - _Unlisted
      listings_sort_reverse: false
      listings_tags_sort_reverse: false
      shadow: false
      shadow_on_serve: true
      shadow_tags:
        - Status/Draft
      shadow_tags_prefix: _
      shadow_tags_suffix: "!"
      listings_map:
        public-cards:
          include:
            - Public
          exclude:
            - Status/Draft
          layout: cards
          toc: false
        guide-scope:
          scope: true
          include:
            - Platform
        shadow-audit:
          shadow: true
          toc: true
      export: true
      export_file: legacy-tags.json
